<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About Aaliyah </h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite show?
        <select id="movie-answer">
          <option value="movie1">Suits</option>
          <option value="movie2">A Good Place</option>
          <option value="movie3">The Summer I turned Pretty</option>
          <option value="movie4">The Vampire Diaries</option>
        </select>
      </label>
      <button type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
      <img class="goodplace">
      <img class="jaylabaddie">
    </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        🍽 What is my favorite dish?
        <select id="book-answer">
          <option value="book1">Sushi</option>
          <option value="book2">Probably a Mug</option>
          <option value="book3">Bolognese</option>
          <option value="book4">Probably a Bowl</option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
      <img class="demi">
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie2") {
          $("#movie-text").text("YESSSS!");
          $(".goodplace").attr("src", "good place.jpg")
        } 
        else {
          $("#movie-text").text("WRONGOOOO! You thought");
          $(".jaylabaddie").attr("src", "no.JPG")
        }
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book2") {
          $("#book-text").text("-Demi Lavato");
          $(".demi").attr("src", "Demi.png")
        } 
        else {
          $("#book-text").text("NOOOOo!");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
